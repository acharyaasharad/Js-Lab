<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theme Preference</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="theme-panel" aria-labelledby="page-title">
      <h1 id="page-title">Theme Preference</h1>

      <div class="actions" role="group" aria-label="Theme preference controls">
        <button class="theme-button" id="light-theme" type="button">
          Light Theme
        </button>
        <button class="theme-button" id="dark-theme" type="button">
          Dark Theme
        </button>
        <button class="theme-button secondary" id="clear-preference" type="button">
          Clear Preference
        </button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <span>sharadvardhan acharya</span>
    <span class="footer-dot" aria-hidden="true">·</span>
    <span>24070521027</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
